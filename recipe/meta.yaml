{% set name = "setuptools-rust" %}
{% set version = "1.12.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: d94a93f0c97751c17014565f07bdc324bee45d396cd1bba83d8e7af92b945f0c

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install --no-deps . -vv --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=62.4
    - setuptools_scm
  run:
    - python
    - setuptools >=62.4
    - semantic_version >=2.8.2,<3

test:
  imports:
    - setuptools_rust
  requires:
    - pip
    - pytest
  source_files:
    - tests/
  commands:
    - pip check
    - pytest -v tests/

about:
  home: https://github.com/PyO3/setuptools-rust
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Setuptools rust extension plugin
  description: |
    setuptools-rust is a plugin for setuptools to build Rust Python extensions implemented with PyO3 or rust-cpython.
    Compile and distribute Python extensions written in Rust as easily as if they were written in C.
  dev_url: https://github.com/PyO3/setuptools-rust
  doc_url: https://setuptools-rust.readthedocs.io/

extra:
  recipe-maintainers:
    - davidhewitt
    - nicoddemus
  # setuptools is a run requirement
  skip-lints:
    - uses_setuptools
