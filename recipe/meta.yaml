{% set name = "setuptools-rust" %}
{% set version = "1.12.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 85ae70989d96c9cfeb5ef79cf3bac2d5200bc5564f720a06edceedbdf6664640

build:
  number: 1
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install --no-deps . -vv --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools_scm
    - setuptools >=62.4
  run:
    - python
    - semantic_version >=2.8.2,<3
    - setuptools >=62.4

# This test will always fail on win_64,
# because _override_cargo_default_target expect to get string different than "x86_64-pc-windows-msvc",
# however it is always same in Anaconda environment.
{% set disabled_tests = "not test_override_cargo_default_target_windows_msvc" %} # [win]
test:
  imports:
    - setuptools_rust
  source_files:
    - tests/
    - examples/
  commands:
    - pip check
    - pytest -v -k "{{ disabled_tests }}" tests/ # [win]
    - pytest -v tests/ # [osx or linux]
  requires:
    - {{ compiler('rust') }} # [osx or linux]
    - pip
    - pytest
    - rust # [win]

about:
  home: https://github.com/PyO3/setuptools-rust
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Setuptools rust extension plugin
  description: |
    setuptools-rust is a plugin for setuptools to build Rust Python extensions implemented with PyO3 or rust-cpython.
    Compile and distribute Python extensions written in Rust as easily as if they were written in C.
  dev_url: https://github.com/PyO3/setuptools-rust
  doc_url: https://setuptools-rust.readthedocs.io/

extra:
  skip-lints:
    # setuptools is needed in host for proper tests running
    - python_build_tools_in_host
    # rust is needed in requires for proper tests running
    - should_use_compilers  # [win]
  recipe-maintainers:
    - davidhewitt
    - nicoddemus
  